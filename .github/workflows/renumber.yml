name: Notion 序号重排

on:
  workflow_dispatch:
    inputs:
      polling_minutes:
        description: '本次循环时长（1 分钟用于验证接续，后续恢复 12 分钟）'
        type: choice
        options:
          - '12'
          - '1'
        default: '12'
  schedule:
    - cron: '2-59/5 * * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: notion-renumber
  cancel-in-progress: false

jobs:
  renumber:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 获取代码
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 设置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: 验证故障恢复逻辑
        run: node --test recovery.test.mjs

      - name: 持续检查并重排序号（轮次间隔 1 秒）
        shell: bash
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID }}
          POLLING_MINUTES: ${{ inputs.polling_minutes || '12' }}
        run: bash poll.sh

      - name: 主动启动下一次运行
        if: ${{ success() && vars.AUTO_CONTINUE != 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh workflow run renumber.yml --ref "$DEFAULT_BRANCH" -f polling_minutes=12
